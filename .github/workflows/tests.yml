name: Automated Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Pure MATLAB Analytical & Unit Tests (Independent of Physical Toolboxes)
  # ---------------------------------------------------------------------------
  analytical-unit-tests:
    name: MATLAB Analytical & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB (Core)
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            MATLAB

      - name: Run Analytical & Unit Tests
        uses: matlab-actions/run-command@v2
        env:
          REQUIRE_SIMULATION_TESTS: "0"
        with:
          command: |
            addpath(genpath('matlab'));
            addpath(genpath('scripts'));
            addpath(genpath('tests'));
            run_all_tests('tests/unit');

  # ---------------------------------------------------------------------------
  # JOB 2: Simulink & Physical Simscape Integration Tests
  # ---------------------------------------------------------------------------
  simulink-integration-tests:
    name: Simulink & Simscape Integration Tests
    needs: analytical-unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB & Simulation Toolboxes
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            MATLAB
            Simulink
            Simscape
            Simscape_Electrical

      - name: Run Integration Test Suite
        uses: matlab-actions/run-command@v2
        env:
          # In CI runners without dedicated hardware license server, allow assumption filtering
          REQUIRE_SIMULATION_TESTS: "0"
        with:
          command: |
            addpath(genpath('matlab'));
            addpath(genpath('scripts'));
            addpath(genpath('tests'));
            run_all_tests('tests/integration');

      - name: Archive Test Results & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-study-reports
          path: results/reports/
          if-no-files-found: ignore
