name: Automated Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    name: Run MATLAB Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            MATLAB
            Simulink
            Simscape
            Simscape_Electrical

      - name: Run test suite via scripts/run_all_tests.m
        uses: matlab-actions/run-command@v2
        env:
          REQUIRE_SIMULATION_TESTS: "1"
        with:
          command: run('scripts/run_all_tests.m')
